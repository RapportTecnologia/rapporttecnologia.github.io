# Site settings
title: "Rapport Tecnologia"
email: "admin@rapport.tec.br"
whatsapp: "(+55 85) 98520-5490"

keywords: ['Rapport Tecnologia', 'software especializado', 'hardware eletrônico', 'sistemas embarcados', 'IoT', 'manutenção preditiva', 'diagnóstico de transformadores', 'processamento digital de sinais', 'inteligência artificial', 'IA agêntica', 'Agentic Space', 'Web 3.0', 'Web 4.0', 'blockchain', 'smart contracts', 'criptoativos', 'tokenomics', 'capacitação tecnológica', 'consultoria tecnológica', 'integração de sistemas', 'soluções digitais', 'inovação tecnológica']
description: "A Rapport Tecnologia desenvolve soluções de software, hardware, IoT, inteligência artificial, blockchain e capacitação técnica para transformar desafios complexos em resultados confiáveis."

lang: "pt-BR"
timezone: "America/Fortaleza"
author: "Rapport Tecnologia"
logo: "/img/header.jpg"
social:
  name: "Rapport Tecnologia"
  links:
    - "https://github.com/rapporttecnologia"

baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://rapport.tec.br" # the base hostname & protocol for your site
urlimg: "img"
defaultimg: "header.jpg"

twitter_username: ""
github_username: rapporttecnologia

# Build settings
markdown: kramdown

collections:  
  # Ativar posts
  posts:
    output: true
  pages:
    output: true
    permalink: /:path/
  portfolio:
    output: true
    permalink: /projetos/:path/
  cursos:
    output: true
    permalink: /cursos/:path/
  clientes:
    output: true
    permalink: /clientes/:path/
  contratos:
    output: true
    permalink: /contrato/:path/
  
defaults:
  - 
    scope:
      path: ""
      type: "contratos"
    values:
      image: "header.jpg"

# Definir a estrutura de URL dos posts
permalink: /blog/:categories/:title/
  
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-feed

include:
  - ".well-known"


exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - README.md
  - LICENSE
  - .gitignore
  - CNAME
  - _draft
  # O plugin jekyll-feed gera /feed.xml; este arquivo legado duplicava essa rota.
  - feed/feed.xml
  # Materiais de referência não são conteúdo publicado.
  - _posts/*.readme
  # As folhas XSLT são referências estáticas e não usam um layout Jekyll.
  - xslt
