<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Cursos de curta duração em tecnologia para comunidades">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a" />
      <stop offset="45%" stop-color="#0d3c5f" />
      <stop offset="100%" stop-color="#1c6a7f" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#56ffda" />
      <stop offset="100%" stop-color="#51a4ff" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56ffda" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#56ffda" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Rede de conexões entre comunidade e conhecimento -->
  <g stroke="#56ffda" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M180 620 C300 520 500 560 600 420" />
    <path d="M1020 620 C900 520 700 560 600 420" />
    <path d="M300 680 C400 580 500 520 600 420" />
    <path d="M900 680 C800 580 700 520 600 420" />
    <path d="M600 180 L600 420" />
    <path d="M600 420 L430 300" />
    <path d="M600 420 L770 300" />
  </g>

  <!-- Nós da rede -->
  <g fill="#56ffda" fill-opacity="0.8">
    <circle cx="180" cy="620" r="10" />
    <circle cx="300" cy="680" r="10" />
    <circle cx="1020" cy="620" r="10" />
    <circle cx="900" cy="680" r="10" />
    <circle cx="600" cy="180" r="12" />
    <circle cx="430" cy="300" r="10" />
    <circle cx="770" cy="300" r="10" />
  </g>

  <!-- Centro do conhecimento -->
  <circle cx="600" cy="420" r="120" fill="url(#glow)" />
  <circle cx="600" cy="420" r="90" fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#softGlow)" />

  <!-- Ícone de livro/curso central -->
  <g transform="translate(540 360)" fill="none" stroke="#51a4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 40 V110 C20 110 45 120 70 110 V40 C45 50 20 40 20 40 Z" fill="rgba(81,164,255,0.15)" />
    <path d="M70 40 V110 C70 120 95 110 120 110 V40 C95 50 70 40 70 40 Z" fill="rgba(81,164,255,0.15)" />
    <path d="M20 40 C45 50 70 40 70 40" />
    <path d="M70 40 C95 50 120 40 120 40" />
  </g>

  <!-- Eixo de tecnologia -->
  <g transform="translate(400 180)">
    <rect width="400" height="120" rx="20" fill="rgba(17,47,77,0.7)" stroke="#51a4ff" stroke-width="2" />
    <!-- chip -->
    <rect x="40" y="35" width="50" height="50" rx="6" fill="none" stroke="#56ffda" stroke-width="3" />
    <line x1="55" y1="25" x2="55" y2="35" stroke="#56ffda" stroke-width="2" />
    <line x1="75" y1="25" x2="75" y2="35" stroke="#56ffda" stroke-width="2" />
    <line x1="55" y1="85" x2="55" y2="95" stroke="#56ffda" stroke-width="2" />
    <line x1="75" y1="85" x2="75" y2="95" stroke="#56ffda" stroke-width="2" />
    <line x1="30" y1="50" x2="40" y2="50" stroke="#56ffda" stroke-width="2" />
    <line x1="30" y1="70" x2="40" y2="70" stroke="#56ffda" stroke-width="2" />
    <line x1="90" y1="50" x2="100" y2="50" stroke="#56ffda" stroke-width="2" />
    <line x1="90" y1="70" x2="100" y2="70" stroke="#56ffda" stroke-width="2" />
    <!-- código -->
    <text x="170" y="55" fill="#56ffda" font-family="'Fira Code', 'Consolas', monospace" font-size="18">&lt;/&gt;</text>
    <!-- blockchain -->
    <rect x="260" y="35" width="40" height="40" rx="6" fill="none" stroke="#ff8ae2" stroke-width="3" />
    <rect x="280" y="35" width="40" height="40" rx="6" fill="none" stroke="#ff8ae2" stroke-width="3" />
    <line x1="300" y1="55" x2="320" y2="55" stroke="#ff8ae2" stroke-width="2" />
    <!-- IA -->
    <text x="350" y="65" fill="#f4df7a" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold">AI</text>
  </g>

  <!-- Silhuetas de comunidade -->
  <g fill="rgba(86,255,218,0.15)" stroke="#56ffda" stroke-width="3">
    <!-- esquerda -->
    <circle cx="220" cy="540" r="22" />
    <path d="M220 565 v70 h-45 v-25 c0-25 20-45 45-45 s45 20 45 45 v25 h-45" fill="none" />
    <!-- centro-esquerda -->
    <circle cx="360" cy="580" r="22" />
    <path d="M360 605 v60 h-45 v-20 c0-25 20-45 45-45 s45 20 45 45 v20 h-45" fill="none" />
    <!-- centro-direita -->
    <circle cx="840" cy="580" r="22" />
    <path d="M840 605 v60 h-45 v-20 c0-25 20-45 45-45 s45 20 45 45 v20 h-45" fill="none" />
    <!-- direita -->
    <circle cx="980" cy="540" r="22" />
    <path d="M980 565 v70 h-45 v-25 c0-25 20-45 45-45 s45 20 45 45 v25 h-45" fill="none" />
  </g>

  <!-- Edifício/comunidade ao fundo -->
  <g fill="none" stroke="#51a4ff" stroke-opacity="0.4" stroke-width="2">
    <rect x="120" y="640" width="100" height="80" />
    <rect x="140" y="670" width="20" height="50" />
    <rect x="180" y="660" width="20" height="60" />
    <rect x="980" y="640" width="100" height="80" />
    <rect x="1000" y="670" width="20" height="50" />
    <rect x="1040" y="660" width="20" height="60" />
  </g>

  <!-- Partículas flutuantes -->
  <g fill="#8ae6ff" fill-opacity="0.6">
    <circle cx="150" cy="150" r="3" />
    <circle cx="320" cy="100" r="4" />
    <circle cx="500" cy="80" r="3" />
    <circle cx="820" cy="90" r="4" />
    <circle cx="1080" cy="150" r="3" />
    <circle cx="960" cy="720" r="4" />
    <circle cx="680" cy="740" r="3" />
    <circle cx="420" cy="720" r="3" />
    <circle cx="200" cy="740" r="4" />
  </g>

  <!-- Texto -->
  <text x="600" y="760" text-anchor="middle" fill="#8ae6ff" font-family="'Segoe UI', sans-serif" font-size="26" letter-spacing="3">
    Capilarização do Conhecimento Tecnológico
  </text>
</svg>
