<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">JWT Lab — Laboratório Didático de JSON Web Tokens</title>
  <desc id="desc">Diagrama com as três partes de um token JWS: header, payload e assinatura, separadas por pontos.</desc>
  <rect width="1200" height="800" fill="#101c30"/>
  <circle cx="1120" cy="60" r="320" fill="#172a44"/>
  <circle cx="40" cy="790" r="260" fill="#14243b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="110" fill="#f5a347" font-size="24" letter-spacing="4">RAPPORT TECNOLOGIA</text>
    <text x="85" y="248" fill="#ffffff" font-size="112" font-weight="700">JWT LAB</text>
    <text x="90" y="310" fill="#c5d3e5" font-size="32">Laboratório Didático de JSON Web Tokens</text>
    <rect x="90" y="400" width="300" height="190" rx="20" fill="#203652" stroke="#fb7ba9" stroke-width="3"/>
    <rect x="450" y="400" width="300" height="190" rx="20" fill="#203652" stroke="#c9a0ff" stroke-width="3"/>
    <rect x="810" y="400" width="300" height="190" rx="20" fill="#203652" stroke="#6fd3f0" stroke-width="3"/>
    <g text-anchor="middle">
      <g font-size="23" letter-spacing="2">
        <text x="240" y="454" fill="#fb7ba9">HEADER</text>
        <text x="600" y="454" fill="#c9a0ff">PAYLOAD</text>
        <text x="960" y="454" fill="#6fd3f0">ASSINATURA</text>
      </g>
      <g font-family="monospace" font-size="42" font-weight="700">
        <text x="240" y="533" fill="#fb7ba9">{ alg }</text>
        <text x="600" y="533" fill="#c9a0ff">{ sub }</text>
        <text x="960" y="533" fill="#6fd3f0">signature</text>
      </g>
      <g fill="#ffffff" font-size="70" font-weight="700">
        <text x="420" y="510">.</text>
        <text x="780" y="510">.</text>
      </g>
    </g>
    <text x="90" y="687" fill="#ffffff" font-size="29">Construa. Assine. Verifique. Criptografe.</text>
    <text x="90" y="737" fill="#91aac8" font-size="23">JWS · JWE · Claims · Aprendizado no navegador</text>
  </g>
</svg>
