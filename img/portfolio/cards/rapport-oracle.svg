<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Rapport Oracle — Oráculo Multi-Chain</title>
  <desc id="desc">Três blockchains — EVM, Solana e Stellar — conectadas a um middleware oracle central.</desc>
  <rect width="1200" height="800" fill="#101c30"/>
  <circle cx="1120" cy="60" r="320" fill="#172a44"/>
  <circle cx="40" cy="790" r="260" fill="#14243b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="110" fill="#f5a347" font-size="24" letter-spacing="4">RAPPORT TECNOLOGIA</text>
    <text x="85" y="248" fill="#ffffff" font-size="96" font-weight="700">RAPPORT ORACLE</text>
    <text x="90" y="310" fill="#c5d3e5" font-size="34">Oráculo Multi-Chain · Modelo Provable</text>
    <g fill="none" stroke="#67aee8" stroke-width="6">
      <path d="M350 495h105m-20-15 20 15-20 15M745 495h105m-20-15 20 15-20 15"/>
    </g>
    <rect x="90" y="400" width="250" height="190" rx="20" fill="#203652" stroke="#67aee8" stroke-width="2"/>
    <rect x="460" y="380" width="280" height="230" rx="20" fill="#f5a347"/>
    <rect x="860" y="400" width="250" height="190" rx="20" fill="#203652" stroke="#67aee8" stroke-width="2"/>
    <g text-anchor="middle">
      <g fill="#c5d3e5" font-size="20" letter-spacing="3">
        <text x="215" y="449">ON-CHAIN</text>
        <text x="985" y="449">ON-CHAIN</text>
      </g>
      <text x="600" y="439" fill="#172238" font-size="20" letter-spacing="3">MIDDLEWARE</text>
      <g font-size="42" font-weight="700">
        <text x="215" y="528" fill="#ffffff">query()</text>
        <text x="600" y="505" fill="#172238">Oracle</text>
        <text x="985" y="528" fill="#ffffff">callback</text>
      </g>
      <g font-size="17">
        <text x="215" y="566" fill="#91aac8">EVM · Solana · Stellar</text>
        <text x="600" y="545" fill="#172238">Cloudflare Workers</text>
        <text x="600" y="575" fill="#172238">+ prova ECDSA/ed25519</text>
        <text x="985" y="566" fill="#91aac8">result + proof</text>
      </g>
    </g>
    <text x="90" y="687" fill="#ffffff" font-size="29">Dados do mundo real, verificáveis on-chain.</text>
    <text x="90" y="737" fill="#91aac8" font-size="23">Polygon · Solana · Stellar · Oraclize/Provable · Open Source</text>
  </g>
</svg>
