<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Nonce — Laboratório Didático de Blockchain</title>
  <desc id="desc">Três blocos conectados ilustram o encadeamento de hashes em uma blockchain.</desc>
  <rect width="1200" height="800" fill="#101c30"/>
  <circle cx="1120" cy="60" r="320" fill="#172a44"/>
  <circle cx="40" cy="790" r="260" fill="#14243b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="110" fill="#f5a347" font-size="24" letter-spacing="4">RAPPORT TECNOLOGIA</text>
    <text x="85" y="248" fill="#ffffff" font-size="112" font-weight="700">NONCE</text>
    <text x="90" y="310" fill="#c5d3e5" font-size="34">Laboratório Didático de Blockchain</text>
    <g fill="none" stroke="#67aee8" stroke-width="6">
      <path d="M350 495H465m-20-15 20 15-20 15M735 495h115m-20-15 20 15-20 15"/>
    </g>
    <rect x="90" y="400" width="260" height="190" rx="20" fill="#203652" stroke="#67aee8" stroke-width="2"/>
    <rect x="470" y="400" width="260" height="190" rx="20" fill="#f5a347"/>
    <rect x="850" y="400" width="260" height="190" rx="20" fill="#203652" stroke="#67aee8" stroke-width="2"/>
    <g text-anchor="middle">
      <g fill="#c5d3e5" font-size="22" letter-spacing="3">
        <text x="220" y="449">BLOCO</text>
        <text x="980" y="449">BLOCO</text>
      </g>
      <text x="600" y="449" fill="#172238" font-size="22" letter-spacing="3">BLOCO</text>
      <g font-size="60" font-weight="700">
        <text x="220" y="532" fill="#ffffff">N−1</text>
        <text x="600" y="532" fill="#172238">N</text>
        <text x="980" y="532" fill="#ffffff">N+1</text>
      </g>
    </g>
    <text x="90" y="687" fill="#ffffff" font-size="29">Explore. Altere o nonce. Observe o hash.</text>
    <text x="90" y="737" fill="#91aac8" font-size="23">SHA-256 · Proof of Work · Integridade dos blocos</text>
  </g>
</svg>
